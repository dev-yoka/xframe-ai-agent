services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: xframe_agent
      POSTGRES_USER: xframe
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xframe -d xframe_agent"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  clamav:
    image: clamav/clamav:stable
    volumes:
      - clamav-data:/var/lib/clamav
    restart: unless-stopped

  xframe-agent:
    image: xframe-agent:v1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env.production
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: /var/run/secrets/gcp.json
    secrets:
      - gcp_sa
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8000/api/v1/agent/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

volumes:
  postgres-data:
  clamav-data:

secrets:
  gcp_sa:
    file: ./secrets/gcp-sa.json
