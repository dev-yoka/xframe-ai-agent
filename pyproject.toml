[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xframe-ai-agent"
version = "0.1.0"
description = "xFRAME Ai Agent FastAPI service for PriceFRAME-assisted pricing workflows"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic>=1.14.0,<2.0.0",
  "anthropic>=0.103.1",
  "arq>=0.26.0,<0.27.0",
  "asyncpg>=0.30.0,<0.31.0",
  "boto3>=1.34.0,<2.0.0",
  "fastapi>=0.115.0,<1.0.0",
  "google-genai>=2.5.0",
  "httpx>=0.28.0,<0.29.0",
  "langfuse>=2.0.0,<3.0.0",
  "prometheus-fastapi-instrumentator>=7.0.0,<8.0.0",
  "pydantic>=2.10.0,<3.0.0",
  "pydantic-settings>=2.6.0,<3.0.0",
  "pyjwt>=2.10.0,<3.0.0",
  "python-multipart>=0.0.20,<1.0.0",
  "redis>=5.2.0,<6.0.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0.0",
  "sse-starlette>=2.1.0,<3.0.0",
  "structlog>=24.4.0,<25.0.0",
  "uvicorn[standard]>=0.34.0,<0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.13.0,<2.0.0",
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<0.25.0",
  "ruff>=0.8.0,<0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xframe_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "N", "S", "UP", "W"]
ignore = [
  "S101",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.12"
files = ["src/xframe_agent", "tests", "evals"]
strict = true
warn_return_any = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_reexport = true

[[tool.mypy.overrides]]
module = [
  "langfuse.*",
  "prometheus_fastapi_instrumentator.*",
  "redis.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
pythonpath = ["src"]
filterwarnings = [
  "error",
]

[dependency-groups]
dev = [
  "aiosqlite>=0.22.1",
  "xframe-ai-agent[dev]",
]
